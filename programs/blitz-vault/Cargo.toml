[package]
name = "blitz-vault"
version = "0.1.0"
description = "BlitzVault: Zero-Fee Real-Time Crash & VRF Relic Pack Arena on MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "blitz_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# Pin 0.18.0: supports both validator 1.x & 2.0 public ERs and compiles #[vrf] cleanly with Anchor 1.0.2
ephemeral-rollups-sdk = { version = "=0.18.0", features = ["anchor", "vrf"] }
